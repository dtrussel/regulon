name: Docs - Publish Documentation Site

# Manually triggered so a missing/unconfigured GitHub Pages setup never
# breaks the required push/PR checks in ci_c.yml. Run from the Actions tab
# (or `gh workflow run docs_c.yml`) to refresh the published site.
#
# The site is built by Sphinx; Doxygen runs underneath it as an XML backend
# for Breathe and is invoked automatically by docs/conf.py, so there is no
# separate Doxygen step here.
#
# First-time setup: enable Pages for this repository with source "GitHub
# Actions" (Settings -> Pages) before the deploy job can publish.
#
# RON-IS-001 §8.1
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx site
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update -q && sudo apt-get install -y doxygen graphviz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload HTML as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
