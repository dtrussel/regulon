name: Nightly - Zephyr Module

# Builds and runs the Zephyr module once a day rather than on every push.
#
# Zephyr is a large external dependency and the module glue changes rarely,
# so gating every push on it would cost far more than it catches. What this
# job guards is drift on the *other* side: a Zephyr release changing Kconfig
# or module conventions under us, and the library behaving differently once
# cross-compiled for a real MCU. A daily run finds either within a day.
#
# The platform matrix and the pass criteria are not defined here — they live
# in zephyr/samples/pid_loop/sample.yaml and zephyr/tests/control/testcase.yaml
# next to the code, so `west twister` reproduces this run locally.
#
# Note that GitHub only runs scheduled workflows on the default branch, so
# this will not fire from a feature branch. Use the Actions tab (or
# `gh workflow run zephyr_nightly.yml`) to exercise it before merging.
#
# RON-IS-001 §8.1
on:
  schedule:
    # 03:17 UTC daily. Off the hour to avoid the top-of-hour scheduling peak,
    # when GitHub delays scheduled runs the most.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zephyr-nightly
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Twister: build and run the sample and the behavioural suite.
  #
  # native_sim needs no SDK; the Cortex-M targets do. The ARM toolchain is the
  # only one installed, which keeps the SDK download to a fraction of the full
  # set. The module allowlist in west.yml keeps the workspace fetch small too.
  # ---------------------------------------------------------------------------
  twister:
    name: Twister (native_sim, Cortex-M3, Cortex-M33)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: regulon

      - name: Set up the Zephyr workspace and SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: regulon
          toolchains: arm-zephyr-eabi

      - name: Run twister
        working-directory: regulon
        run: |
          west twister \
            -T zephyr/samples -T zephyr/tests \
            -p native_sim/native/64 \
            -p qemu_cortex_m3 \
            -p mps2/an521/cpu0 \
            --inline-logs -v

      - name: Upload twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: |
            regulon/twister-out/twister.xml
            regulon/twister-out/**/handler.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Cross-compile only.
  #
  # Cortex-M4F and M7 have no in-tree QEMU target, so these are compile and
  # link checks — but they still cover hard-float ABI selection, FPU code
  # generation, and the vendor HAL a real board pulls in. Kept as plain west
  # builds because twister has no runnable platform to attach them to.
  # ---------------------------------------------------------------------------
  cross-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: mps2/an386
            name: mps2/an386 - Cortex-M4F (hard float)
          - board: mps2/an500
            name: mps2/an500 - Cortex-M7
          - board: nrf52840dk/nrf52840
            name: nRF52840 DK - Cortex-M4F, vendor HAL

    steps:
      - uses: actions/checkout@v4
        with:
          path: regulon

      - name: Set up the Zephyr workspace and SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: regulon
          toolchains: arm-zephyr-eabi

      - name: Cross-compile for ${{ matrix.board }}
        working-directory: regulon
        run: |
          west build -b "${{ matrix.board }}" -d build -p always zephyr/tests/control

          # Report the footprint; it is the number an integrator wants here.
          arm_size=$(find "$ZEPHYR_SDK_INSTALL_DIR" -name 'arm-zephyr-eabi-size' | head -1)
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            "${arm_size:-size}" build/zephyr/zephyr.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build-system assertions twister cannot express.
  #
  # These inspect the produced archive rather than runtime behaviour: that the
  # minimum-footprint build links exactly the mandatory baseline, and that the
  # complete build links one object per source in the standalone build's
  # manifest — which is what catches a new source that never gets wired into
  # the Zephyr glue.
  # ---------------------------------------------------------------------------
  module-selection:
    name: Kconfig module selection
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: regulon

      - name: Set up the Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: regulon
          toolchains: arm-zephyr-eabi

      - name: Minimum footprint links only the baseline
        working-directory: regulon
        run: |
          west build -b native_sim/native/64 -d build-min -p always zephyr/samples/pid_loop
          objs=$(ar t build-min/modules/regulon/libregulon.a | sort | tr '\n' ' ')
          echo "objects: $objs"
          expected="ron_feedforward.c.obj ron_pid_api.c.obj ron_pid_config.c.obj ron_pid_core.c.obj ron_pid_fault.c.obj "
          [ "$objs" = "$expected" ] || {
            echo "::error::expected only the mandatory baseline objects"
            echo "expected: $expected"
            exit 1
          }

      - name: Complete build links every manifest source
        working-directory: regulon
        run: |
          west build -b native_sim/native/64 -d build-full -p always zephyr/tests/control
          want=$(grep -cvE '^[[:space:]]*(#.*)?$' regulon-c/scripts/lib_sources.txt)
          got=$(ar t build-full/modules/regulon/libregulon.a | wc -l)
          echo "sources in manifest: $want, objects linked: $got"
          [ "$want" -eq "$got" ] || {
            echo "::error::complete build linked $got objects, manifest lists $want"
            exit 1
          }
