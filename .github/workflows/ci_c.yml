name: CI - C11 Library

# RON-TP-001 §2.6 | RON-TC-QUAL-008
# Triggers on every push/PR to any branch. Must pass before merging to main.

on:
  push:
    branches: ["**"]
    paths:
      - "regulon-c/**"
      - "docs/**"
      - "CHANGELOG.rst"
      - ".clang-format"
      - ".github/workflows/ci_c.yml"
  pull_request:
    branches: [main]
    paths:
      - "regulon-c/**"
      - "docs/**"
      - "CHANGELOG.rst"
      - ".clang-format"
      - ".github/workflows/ci_c.yml"

env:
  BUILD_DIR: regulon-c/build_host
  BUILD_DIR_COV: regulon-c/build_cov
  SRC_DIR: regulon-c

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build + Unit Tests with AddressSanitizer / UBSan
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (GCC + ASan/UBSan)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake gcc clang clang-format cppcheck \
               python3 python3-pip

      - name: Configure (GCC, tests enabled, sanitisers)
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=ON \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel

      - name: Run tests (ctest with JUnit XML)
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure --output-junit test_results_c.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-c
          path: ${{ env.BUILD_DIR }}/test_results_c.xml

  # ---------------------------------------------------------------------------
  # Job 2: Double-precision host regression
  # ---------------------------------------------------------------------------
  build-double:
    name: Build & Test (GCC Double)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Configure (GCC, double precision)
        run: |
          cmake -B regulon-c/build_double -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=ON \
                -DRON_USE_DOUBLE=ON \
                -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build regulon-c/build_double --parallel

      - name: Run tests
        run: |
          cd regulon-c/build_double
          ctest --output-on-failure --output-junit test_results_c_double.xml

  # ---------------------------------------------------------------------------
  # Job 3: Clang build + tests (secondary host toolchain)
  # ---------------------------------------------------------------------------
  build-clang:
    name: Build & Test (Clang)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake clang

      - name: Configure (Clang, tests enabled)
        run: |
          cmake -B regulon-c/build_clang -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=ON \
                -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build regulon-c/build_clang --parallel

      - name: Run tests
        run: |
          cd regulon-c/build_clang
          ctest --output-on-failure --output-junit test_results_c_clang.xml

  # ---------------------------------------------------------------------------
  # Job 4: Code formatting check (clang-format)
  # ---------------------------------------------------------------------------
  format-check:
    name: clang-format Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          mapfile -t FILES < <(grep -vE '^[[:space:]]*(#.*)?$' regulon-c/scripts/format_files.txt)
          clang-format --dry-run --Werror "${FILES[@]}"

  # ---------------------------------------------------------------------------
  # Job 4b: Stack usage
  #
  # The library runs from ISRs and from RTOS threads whose stacks are sized in
  # single kilobytes, so a frame that quietly grows is a defect rather than a
  # style issue - and an easy one to introduce, since every scratch matrix is
  # sized at RON_MAT_MAX_DIM whatever dimensions are configured. The build
  # already emits -fstack-usage data; this reads it back.
  # ---------------------------------------------------------------------------
  stack-usage:
    name: Stack Usage Budget
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Build (GCC emits .su files)
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF -DCMAKE_C_COMPILER=gcc
          cmake --build ${{ env.BUILD_DIR }} --parallel

      - name: Check against the budget
        run: bash regulon-c/scripts/check_stack_usage.sh ${{ env.BUILD_DIR }} 768

  # ---------------------------------------------------------------------------
  # Job 5: Static analysis - cppcheck (MISRA subset) + complexity
  # ---------------------------------------------------------------------------
  static-analysis:
    name: cppcheck Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cppcheck python3 python3-pip
          python3 -m pip install --user lizard

      - name: Run cppcheck (MISRA addon)
        run: |
          mapfile -t SRC < <(grep -vE '^[[:space:]]*(#.*)?$' regulon-c/scripts/lib_sources.txt)
          cppcheck --addon=misra.py --check-level=exhaustive \
                   --enable=style --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   --suppress=misra-c2012-2.5 \
                   --suppress=misra-c2012-8.7 \
                   --suppress=misra-c2012-15.5 \
                   --suppress=misra-c2012-15.7 \
                   --suppress=misra-c2012-20.10 \
                   -I regulon-c/include \
                   -I regulon-c/src \
                   "${SRC[@]}" \
                   2>&1 | tee cppcheck_results.txt

      - name: Run complexity check
        run: |
          mapfile -t SRC < <(grep -vE '^[[:space:]]*(#.*)?$' regulon-c/scripts/lib_sources.txt)
          python3 -m lizard -C 10 "${SRC[@]}"

      - name: Upload cppcheck results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-results
          path: cppcheck_results.txt

  # ---------------------------------------------------------------------------
  # Job 6: Code coverage (must reach 100% statement + branch - RON-QR-022)
  # ---------------------------------------------------------------------------
  coverage:
    name: Code Coverage (LLVM)
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake clang llvm ninja-build python3

      - name: Configure with LLVM coverage instrumentation
        run: |
          cmake -G Ninja -B ${{ env.BUILD_DIR_COV }} -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=ON \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_C_FLAGS="-O0 -g -fprofile-instr-generate -fcoverage-mapping"

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR_COV }} --parallel

      - name: Run tests
        run: |
          mkdir -p ${{ env.BUILD_DIR_COV }}/profiles
          export LLVM_PROFILE_FILE="${{ github.workspace }}/${{ env.BUILD_DIR_COV }}/profiles/%p.profraw"
          ctest --test-dir ${{ env.BUILD_DIR_COV }} --output-on-failure

      - name: Collect coverage
        run: |
          llvm-profdata merge -sparse \
            ${{ env.BUILD_DIR_COV }}/profiles/*.profraw \
            -o ${{ env.BUILD_DIR_COV }}/coverage.profdata

          mapfile -t test_bins < <(find ${{ env.BUILD_DIR_COV }} -type f -executable -name 'test_ron_*' | sort)
          if [ "${#test_bins[@]}" -eq 0 ]; then
            echo "No Regulon test executables found"
            exit 1
          fi

          object_args=("${test_bins[0]}")
          for bin in "${test_bins[@]:1}"; do
            object_args+=("-object" "$bin")
          done

          source_args=()
          while IFS= read -r src_file; do
            source_args+=(-sources "$src_file")
          done < <(grep -vE '^[[:space:]]*(#.*)?$' regulon-c/scripts/lib_sources.txt)

          llvm-cov export "${object_args[@]}" \
            -instr-profile ${{ env.BUILD_DIR_COV }}/coverage.profdata \
            -format=text -summary-only -show-branch-summary \
            "${source_args[@]}" > coverage.json

          llvm-cov show "${object_args[@]}" \
            -instr-profile ${{ env.BUILD_DIR_COV }}/coverage.profdata \
            -format=html -output-dir coverage_html -show-branch-summary \
            "${source_args[@]}"

          python3 - <<'PY'
          import json
          with open("coverage.json", encoding="utf-8") as f:
              totals = json.load(f)["data"][0]["totals"]
          line_pct = totals["lines"]["percent"]
          branch_pct = totals["branches"]["percent"]
          print(f"LLVM coverage: lines={line_pct:.1f}%; branches={branch_pct:.1f}%")
          if line_pct != 100.0 or branch_pct != 100.0:
              raise SystemExit(1)
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_html/
            coverage.json
            ${{ env.BUILD_DIR_COV }}/coverage.profdata

  # ---------------------------------------------------------------------------
  # Job 7: ARM cross-compile smoke build (RON-TC-QUAL-022)
  # ---------------------------------------------------------------------------
  cross-arm:
    name: Cross Compile (ARM Cortex-M)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure ARM PID build
        run: |
          cmake -G Ninja -B regulon-c/build_arm -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF \
                -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/regulon-c/cmake/toolchains/arm-none-eabi.cmake \
                -DRON_ARM_GCC_NEWLIB_INCLUDE=/usr/include/newlib \
                -DRON_ARM_GCC_ALLOW_HEADER_SHIM=OFF \
                -DCMAKE_C_FLAGS="-mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard -mthumb"

      - name: Build ARM PID library
        run: cmake --build regulon-c/build_arm --parallel

  # ---------------------------------------------------------------------------
  # Job 8: ARMv7 Clang bare-metal cross-compile smoke build (RON-TC-QUAL-022)
  # ---------------------------------------------------------------------------
  cross-arm-clang:
    name: Cross Compile (ARMv7 Clang)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang llvm libnewlib-arm-none-eabi

      - name: Configure ARMv7 Clang PID build
        run: |
          cmake -G Ninja -B regulon-c/build_armv7_clang -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF \
                -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/regulon-c/cmake/toolchains/armv7-none-eabi-clang.cmake \
                -DRON_ARM_CLANG_NEWLIB_INCLUDE=/usr/include/newlib \
                -DRON_ARM_CLANG_ALLOW_HEADER_SHIM=OFF

      - name: Build ARMv7 Clang PID library
        run: cmake --build regulon-c/build_armv7_clang --parallel

  # ---------------------------------------------------------------------------
  # Job 9: RISC-V cross-compile smoke build (RON-TC-QUAL-022)
  # ---------------------------------------------------------------------------
  cross-riscv:
    name: Cross Compile (RISC-V rv32imc)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Configure RISC-V build
        run: |
          cmake -G Ninja -B regulon-c/build_riscv -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF \
                -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/regulon-c/cmake/toolchains/riscv32-unknown-elf.cmake \
                -DRON_RISCV_GCC_LIBC_INCLUDE=/usr/lib/picolibc/riscv64-unknown-elf/include \
                -DRON_RISCV_GCC_ALLOW_HEADER_SHIM=OFF \
                -DCMAKE_C_FLAGS="-march=rv32imc -mabi=ilp32"

      - name: Build RISC-V library
        run: cmake --build regulon-c/build_riscv --parallel

  # ---------------------------------------------------------------------------
  # Job 10: CBMC Formal Verification (RON-TP-001)
  # ---------------------------------------------------------------------------
  formal-verification:
    name: CBMC Formal Proofs
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install CBMC
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cbmc

      - name: Run CBMC proofs (if any harnesses exist)
        run: |
          set -o pipefail
          mkdir -p cbmc-results
          mapfile -t SRC < <(grep -vE '^[[:space:]]*(#.*)?$' regulon-c/scripts/lib_sources.txt)
          PROOFS=$(find regulon-c/test/formal -name "*_proof.c" 2>/dev/null || true)
          if [ -z "$PROOFS" ]; then
            echo "No CBMC harnesses yet - skipping formal verification."
            exit 0
          fi
          for harness in $PROOFS; do
            entry=$(basename "$harness" .c)
            echo "=== CBMC: $harness ==="
            cbmc --function "$entry" \
                 --unwind 65 --unwinding-assertions \
                 --bounds-check --pointer-check \
                 "$harness" \
                 "${SRC[@]}" \
                 -I regulon-c/include \
                 -I regulon-c/src \
                 -I regulon-c/test/formal \
                 2>&1 | tee "cbmc-results/${entry}.txt"
          done

      - name: Upload CBMC results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbmc-results
          path: cbmc-results/

  # ---------------------------------------------------------------------------
  # Job 11: Source-manifest drift check (RON-IS-001 §8.1)
  #
  # The format / cppcheck / lizard / coverage / CBMC jobs read their file lists
  # from scripts/lib_sources.txt and scripts/format_files.txt.  This job fails
  # if a production source has been added without being registered in those
  # manifests, so no file can silently escape a gate.
  # ---------------------------------------------------------------------------
  manifest-check:
    name: Source Manifest Drift Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Verify manifests are in sync with the tree
        run: bash regulon-c/scripts/check_manifest.sh

  # ---------------------------------------------------------------------------
  # Job 12: Minimal-subset smoke build (per-module selection)
  #
  # Builds the mandatory PID baseline only (every RON_ENABLE_* OFF) to prove the
  # module compile-guards and the RON_HAVE_<MODULE> aggregate-header gating are
  # correct.  Tests are disabled; this is a compile + link smoke check.
  # ---------------------------------------------------------------------------
  build-subset:
    name: Build (Minimal Subset, PID-only)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Configure (all optional modules OFF, tests OFF)
        run: |
          cmake -B regulon-c/build_subset -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF \
                -DRON_ENABLE_FILTER=OFF \
                -DRON_ENABLE_GAIN_SCHED=OFF \
                -DRON_ENABLE_TRAJECTORY=OFF \
                -DRON_ENABLE_CASCADE=OFF \
                -DRON_ENABLE_KALMAN=OFF \
                -DRON_ENABLE_STATESPACE=OFF \
                -DRON_ENABLE_AUTOTUNE=OFF \
                -DRON_ENABLE_HEALTH=OFF \
                -DRON_ENABLE_METRICS=OFF \
                -DCMAKE_C_COMPILER=gcc

      - name: Build PID-only library
        run: cmake --build regulon-c/build_subset --parallel

  # ---------------------------------------------------------------------------
  # Job 13: Host example programs (RON_BUILD_EXAMPLES)
  #
  # Examples are host-only documentation programs that link the full library via
  # ron/ron.h.  Building them on GCC and Clang under -Werror catches public-API
  # drift and warning regressions.  Examples are not part of any production gate.
  # ---------------------------------------------------------------------------
  build-examples:
    name: Build Examples (GCC + Clang)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc clang

      - name: Build and run examples (GCC)
        run: |
          cmake -B regulon-c/build_ex_gcc -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF -DRON_BUILD_EXAMPLES=ON \
                -DCMAKE_C_COMPILER=gcc
          cmake --build regulon-c/build_ex_gcc --parallel
          ./regulon-c/build_ex_gcc/examples/pid_quickstart
          ./regulon-c/build_ex_gcc/examples/cascade_control_loop
          ./regulon-c/build_ex_gcc/examples/kalman_estimation
          ./regulon-c/build_ex_gcc/examples/statespace_observer
          ./regulon-c/build_ex_gcc/examples/autotune_relay
          ./regulon-c/build_ex_gcc/examples/trajectory_motion
          ./regulon-c/build_ex_gcc/examples/lqr_lqg_control

      - name: Build examples (Clang)
        run: |
          cmake -B regulon-c/build_ex_clang -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF -DRON_BUILD_EXAMPLES=ON \
                -DCMAKE_C_COMPILER=clang
          cmake --build regulon-c/build_ex_clang --parallel

  # ---------------------------------------------------------------------------
  # Job 14: Host timing benchmark (RON_BUILD_BENCHMARKS, RON-PR-001/RON-PR-003)
  #
  # Informational, not a certified WCET analysis (RON-PR-001/RON-PR-003 defer
  # the certified budget to target-specific integration): only fails on a
  # gross regression (>100 ms/step), so ordinary CI-runner jitter around the
  # 10 kHz design-target budget does not break the build.
  # ---------------------------------------------------------------------------
  benchmark:
    name: Timing Benchmark (informational)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Build and run benchmark
        run: |
          cmake -B regulon-c/build_bench -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF -DRON_BUILD_BENCHMARKS=ON \
                -DCMAKE_C_COMPILER=gcc
          cmake --build regulon-c/build_bench --parallel
          ./regulon-c/build_bench/bench/bench_step

  # ---------------------------------------------------------------------------
  # Job 15: Package-install smoke test (find_package(regulon) / pkg-config)
  #
  # Builds and installs the library to a throwaway prefix, then configures a
  # standalone consumer project (regulon-c/scripts/package_smoke) against
  # that installed package via CMAKE_PREFIX_PATH, proving the exported
  # regulonConfig.cmake / regulonTargets.cmake / regulon.pc actually resolve
  # for an out-of-tree consumer.
  # ---------------------------------------------------------------------------
  package-install-smoke:
    name: Package Install Smoke Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc pkg-config

      - name: Build and install regulon to a throwaway prefix
        run: |
          cmake -B regulon-c/build_pkg -S ${{ env.SRC_DIR }} \
                -DRON_BUILD_TESTS=OFF -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/regulon-install
          cmake --build regulon-c/build_pkg --parallel
          cmake --install regulon-c/build_pkg

      - name: Configure and build the consumer fixture via find_package(regulon)
        run: |
          cmake -B regulon-c/scripts/package_smoke/build -S regulon-c/scripts/package_smoke \
                -DCMAKE_PREFIX_PATH=${{ runner.temp }}/regulon-install \
                -DCMAKE_C_COMPILER=gcc
          cmake --build regulon-c/scripts/package_smoke/build
          ./regulon-c/scripts/package_smoke/build/package_smoke

      - name: Compile the consumer fixture via pkg-config
        run: |
          export PKG_CONFIG_PATH=${{ runner.temp }}/regulon-install/lib/pkgconfig
          gcc regulon-c/scripts/package_smoke/main.c $(pkg-config --cflags --libs regulon) \
              -o /tmp/package_smoke_pc
          /tmp/package_smoke_pc

  # ---------------------------------------------------------------------------
  # Job 16: Documentation build
  #
  # Builds the Sphinx site with warnings promoted to errors, so a broken
  # directive, a dead cross-reference, or an undocumented parameter fails at
  # review time rather than when the site is published.  Doxygen runs
  # underneath as Breathe's XML backend and is invoked by docs/conf.py, with
  # its own WARN_AS_ERROR set in regulon-c/Doxyfile.
  #
  # This job does not deploy; publishing is the manually-triggered
  # docs_c.yml workflow.
  # ---------------------------------------------------------------------------
  docs-build:
    name: Documentation Build (Sphinx + Doxygen)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update -q && sudo apt-get install -y doxygen graphviz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        run: pip install -r docs/requirements.txt

      - name: Build site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check for broken external links
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
