CONFIG_ZTEST=y

# Build the complete library so every optional module's behavioural test is
# compiled in. Individual modules can be switched off to check that the
# Kconfig gating and the generated RON_HAVE_* macros agree.
CONFIG_REGULON=y

# CONFIG_FPU is deliberately not set: it is board-dependent, and forcing it
# warns on targets that have no FPU (Cortex-M3, for instance). Boards with one
# enable it in their own defconfig. The library works either way; soft float is
# only slower.

# The LQR/LQG DARE solve at init is the deepest call chain in the library
# (~950 B), so it needs more than the ~1 kB default thread. Everything else,
# including the Kalman update, fits the default. See the stack sizing section
# of docs/guides/zephyr.rst.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZTEST_STACK_SIZE=2048
