CONFIG_ZTEST=y

# Build the complete library so every optional module's behavioural test is
# compiled in. Individual modules can be switched off to check that the
# Kconfig gating and the generated RON_HAVE_* macros agree.
CONFIG_REGULON=y

# The matrix modules need real stack: the DARE solver's frame alone is around
# 2.4 kB and the Kalman covariance update around 1.9 kB, so a call chain
# reaches roughly 4 kB. Zephyr's default thread stack is far below that, and
# overflowing it does not fault cleanly here - it corrupts and hangs. See the
# stack sizing section of docs/guides/zephyr.rst.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

# CONFIG_FPU is deliberately not set: it is board-dependent, and forcing it
# warns on targets that have no FPU (Cortex-M3, for instance). Boards with one
# enable it in their own defconfig. The library works either way; soft float is
# only slower.
